[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometor-klein"
authors = [{name = "phi ARCHITECT", email = "phi@geometor.com"}]
description = "Dual-treatise bilingual Book Codex and exact symbolic constructibility & Erlangen transformation-group engine for Felix Klein's Famous Problems of Elementary Geometry (1895/1897) and Erlangen Program (1872/1893)."
readme = "README.rst"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "sympy",
    "geometor-model",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
geometor-klein = "geometor.klein.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.klein.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/klein"
"Repository" = "https://github.com/geometor/klein"
"Issues" = "https://github.com/geometor/klein/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
